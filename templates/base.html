<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titel %}Hof Hesselmann{% endblock %} – Hof Hesselmann</title>
  <style>
    :root { --gruen:#3d6b35; --gruen-hell:#e8f0e5; --gelb:#fff4cc; --rand:#d9d4c7; --text:#2b2b2b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--text); background:#faf8f3; }
    header { background:var(--gruen); color:#fff; padding:.6rem 1.2rem; display:flex; gap:1.2rem; align-items:center; flex-wrap:wrap; }
    header .marke { font-weight:700; font-size:1.15rem; margin-right:auto; }
    header a { color:#fff; text-decoration:none; }
    header a:hover { text-decoration:underline; }
    header form { margin:0; }
    header button { background:none; border:1px solid #fff8; color:#fff; padding:.25rem .6rem; border-radius:4px; cursor:pointer; }
    .zahl { background:#f0b429; color:#2b2b2b; border-radius:999px; padding:0 .45rem; font-size:.8rem; font-weight:700; }
    main { padding:1.2rem; max-width:1400px; margin:0 auto; }
    h1 { margin-top:0; font-size:1.5rem; }
    .meldung { padding:.6rem .9rem; border-radius:6px; margin-bottom:1rem; background:var(--gruen-hell); }
    .meldung.error { background:#fbe3e3; }
    .knopf { display:inline-block; background:var(--gruen); color:#fff; border:0; padding:.45rem .9rem; border-radius:5px; text-decoration:none; cursor:pointer; font-size:.95rem; }
    .knopf.grau { background:#777; }
    .knopf.rot { background:#a33; }
    .karte { background:#fff; border:1px solid var(--rand); border-radius:8px; padding:1rem; margin-bottom:1rem; }
    form p { margin:.6rem 0; }
    form label { display:block; font-weight:600; margin-bottom:.15rem; }
    input, select, textarea { font:inherit; padding:.35rem .5rem; border:1px solid #bbb; border-radius:4px; width:100%; max-width:28rem; }
    .errorlist { color:#a33; margin:.2rem 0; padding-left:1.1rem; }
    .helptext { color:#666; font-size:.85rem; }
    code { background:#f1efe8; padding:.1rem .3rem; border-radius:3px; word-break:break-all; }
    {% block stil %}{% endblock %}
  </style>
</head>
<body>
  <header>
    <span class="marke">Hof Hesselmann</span>
    {% if user.is_authenticated %}
      <a href="{% url 'kalender:woche' %}">Kalender</a>
      <a href="{% url 'kalender:anfragen' %}">Anfragen{% if anzahl_offen %} <span class="zahl">{{ anzahl_offen }}</span>{% endif %}</a>
      <a href="{% url 'kalender:buchung_neu' %}">+ Buchung</a>
      <a href="{% url 'kalender:abos' %}">Google Kalender</a>
      {% if user.is_staff %}<a href="{% url 'admin:index' %}">Verwaltung</a>{% endif %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Abmelden</button></form>
    {% endif %}
  </header>
  <main>
    {% for m in messages %}<div class="meldung {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block inhalt %}{% endblock %}
  </main>
</body>
</html>
